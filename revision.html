<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Tracker — April 2026</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 2rem; }
      .tracker { max-width: 860px; margin: 0 auto; }
      .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
      .title { font-size: 20px; font-weight: 500; }
      .subtitle { font-size: 13px; color: #666; margin-top: 2px; }
      .print-btn { font-size: 13px; padding: 6px 14px; border: 0.5px solid #ccc; border-radius: 8px; background: transparent; color: #1a1a1a; cursor: pointer; }
      .print-btn:hover { background: #f5f5f3; }
      .status { font-size: 12px; color: #aaa; align-self: center; }
      .summary-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 1.25rem; }
      .sum-card { background: #f5f5f3; border-radius: 8px; padding: 10px 12px; text-align: center; }
      .sum-label { font-size: 11px; color: #666; margin-bottom: 4px; }
      .sum-val { font-size: 16px; font-weight: 500; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { font-weight: 500; font-size: 11px; color: #666; text-align: center; padding: 6px 4px; border-bottom: 0.5px solid #e0e0e0; }
      th.date-col { text-align: left; min-width: 90px; }
      td { padding: 2px 3px; border-bottom: 0.5px solid #e8e8e8; vertical-align: middle; }
      td.date-cell { font-size: 12px; color: #555; padding: 4px 4px; white-space: nowrap; }
      td.date-cell span { display: block; font-size: 11px; color: #aaa; }
      td.total-cell { font-size: 12px; font-weight: 500; text-align: center; }
      input[type="number"] { width: 100%; border: 0.5px solid #ddd; border-radius: 4px; padding: 4px 2px; font-size: 13px; text-align: center; background: transparent; color: #1a1a1a; -moz-appearance: textfield; }
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
      input[type="number"]:focus { outline: none; border-color: #999; background: #fafafa; }
      .weekend { background: #fafaf8; }
      th.col-phy { color: #185FA5; }
      th.col-pur { color: #3B6D11; }
      th.col-mec { color: #993C1D; }
      th.col-sta { color: #854F0B; }
      th.col-cs  { color: #533AB7; }
      @media print {
        body { padding: 0.5rem; }
        .print-btn, .status { display: none; }
        input[type="number"] { border: 0.5px solid #ccc; }
        table { font-size: 11px; }
        input[type="number"] { font-size: 11px; }
        .summary-row { margin-bottom: 0.75rem; }
        @page { margin: 1cm; size: A4 landscape; }
      }
    </style>
  </head>
  <body>
    <div class="tracker">
      <div class="header">
        <div>
          <div class="title">Revision tracker — April 2026</div>
          <div class="subtitle">1 Apr – 20 Apr · Log hours per subject each day</div>
        </div>
        <span class="status" id="status">Loading...</span>
        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
      </div>

      <div class="summary-row">
        <div class="sum-card"><div class="sum-label">Total hrs</div><div class="sum-val" id="s-total">0</div></div>
        <div class="sum-card"><div class="sum-label" style="color:#185FA5">Physics</div><div class="sum-val" id="s-phy">0</div></div>
        <div class="sum-card"><div class="sum-label" style="color:#3B6D11">Pure</div><div class="sum-val" id="s-pur">0</div></div>
        <div class="sum-card"><div class="sum-label" style="color:#993C1D">Mechanics</div><div class="sum-val" id="s-mec">0</div></div>
        <div class="sum-card"><div class="sum-label" style="color:#854F0B">Stats</div><div class="sum-val" id="s-sta">0</div></div>
        <div class="sum-card"><div class="sum-label" style="color:#533AB7">Comp Sci</div><div class="sum-val" id="s-cs">0</div></div>
      </div>

      <table id="tracker-table">
        <thead>
          <tr>
            <th class="date-col">Date</th>
            <th class="col-phy">Physics</th>
            <th class="col-pur">Pure</th>
            <th class="col-mec">Mechanics</th>
            <th class="col-sta">Stats</th>
            <th class="col-cs">Comp Sci</th>
            <th>Daily total</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA8A1-RBnHUVCVVbmQ_gHfb6mn1_BWnHhE",
        authDomain: "ollie-portfolio-223da.firebaseapp.com",
        projectId: "ollie-portfolio-223da",
        storageBucket: "ollie-portfolio-223da.firebasestorage.app",
        messagingSenderId: "133940273771",
        appId: "1:133940273771:web:e0c766419dada64ac7872e",
        measurementId: "G-GEYKKPZF84"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const subjects = ['phy','pur','mec','sta','cs'];
      const weekend = [0,6];
      const start = new Date(2026, 3, 1);
      const end = new Date(2026, 3, 20);
      const tbody = document.getElementById('tbody');
      const statusEl = document.getElementById('status');

      let data = {};
      let saveTimer = null;
      let authToken = null;

      async function getAuthToken() {
        try {
          const configSnap = await getDoc(doc(db, 'auth', 'config'));
          if (configSnap.exists()) {
            return configSnap.data().token;
          }
        } catch (e) {
          console.error('Failed to fetch auth token:', e);
        }
        return null;
      }

      function initData() {
        for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
          const key = d.toISOString().slice(0,10);
          data[key] = {};
          subjects.forEach(s => data[key][s] = '');
        }
      }

      async function loadData() {
        try {
          authToken = await getAuthToken();
          if (!authToken) {
            statusEl.textContent = 'Auth failed';
            initData();
            renderTable();
            updateTotals();
            return;
          }
          const docSnap = await getDoc(doc(db, 'tracker', 'april2026'));
          if (docSnap.exists()) {
            data = docSnap.data();
            delete data.token;
          } else {
            initData();
          }
          statusEl.textContent = 'Synced';
        } catch (e) {
          initData();
          statusEl.textContent = 'Offline';
        }
        renderTable();
        updateTotals();
      }

      function saveData() {
        const TOKEN = 'revision123';
        clearTimeout(saveTimer);
        statusEl.textContent = 'Saving...';
        saveTimer = setTimeout(async () => {
          try {
            await setDoc(doc(db, 'tracker', 'april2026'), {...data, token: TOKEN});
            statusEl.textContent = 'Synced';
          } catch (e) {
            statusEl.textContent = e.code === 'permission-denied' ? 'Auth failed' : 'Save failed';
          }
        }, 1000);
      }

      function renderTable() {
        tbody.innerHTML = '';
        for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
          const key = d.toISOString().slice(0,10);
          const dow = d.getDay();
          const isWE = weekend.includes(dow);
          const tr = document.createElement('tr');
          if (isWE) tr.className = 'weekend';

          const dateTd = document.createElement('td');
          dateTd.className = 'date-cell';
          dateTd.innerHTML = `${days[dow]} ${d.getDate()} Apr<span>${isWE ? 'Weekend' : ''}</span>`;
          tr.appendChild(dateTd);

          subjects.forEach(s => {
            const td = document.createElement('td');
            const inp = document.createElement('input');
            inp.type = 'number';
            inp.min = 0;
            inp.step = 0.5;
            inp.placeholder = '—';
            inp.value = data[key] ? (data[key][s] || '') : '';
            inp.dataset.key = key;
            inp.dataset.sub = s;
            inp.addEventListener('input', function() {
              if (!data[this.dataset.key]) data[this.dataset.key] = {};
              data[this.dataset.key][this.dataset.sub] = this.value;
              updateTotals();
              saveData();
            });
            td.appendChild(inp);
            tr.appendChild(td);
          });

          const totalTd = document.createElement('td');
          totalTd.className = 'total-cell';
          totalTd.id = 'row-' + key;
          totalTd.textContent = '—';
          tr.appendChild(totalTd);

          tbody.appendChild(tr);
        }
      }

      function updateTotals() {
        let grandTotal = 0;
        const subTotals = {};
        subjects.forEach(s => subTotals[s] = 0);

        for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
          const key = d.toISOString().slice(0,10);
          let rowTotal = 0;
          subjects.forEach(s => {
            const v = parseFloat(data[key] ? data[key][s] : 0) || 0;
            subTotals[s] += v;
            rowTotal += v;
            grandTotal += v;
          });
          const cell = document.getElementById('row-' + key);
          if (cell) cell.textContent = rowTotal > 0 ? rowTotal.toFixed(1) : '—';
        }

        document.getElementById('s-total').textContent = grandTotal.toFixed(1);
        subjects.forEach(s => {
          document.getElementById('s-' + s).textContent = subTotals[s].toFixed(1);
        });
      }

      loadData();
    </script>
  </body>
</html>
